<section
  id="gallery"
  class="scroll-mt-24 bg-slate-50 py-20 sm:py-24"
>

  <div
    class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8"
  >

    <!-- HEADER -->
    <div class="max-w-2xl">

      <p class="section-kicker">
        Campus life
      </p>

      <h2
        class="mt-3 text-3xl font-black leading-tight text-slate-950 sm:text-5xl"
      >
        A glimpse of learning, events and everyday school energy.
      </h2>

    </div>


    <!-- LOADING -->
    <div
      *ngIf="loading"
      class="mt-12 rounded-xl border border-slate-200 bg-white p-10 text-center"
    >

      <p class="font-semibold text-slate-600">
        Loading gallery...
      </p>

    </div>


    <!-- ERROR -->
    <div
      *ngIf="!loading && errorMessage"
      class="mt-12 rounded-xl border border-red-200 bg-red-50 p-8 text-center"
    >

      <p class="font-semibold text-red-700">
        {{ errorMessage }}
      </p>

    </div>


    <!-- GALLERY -->
    <div
      *ngIf="!loading && !errorMessage && images.length > 0"
      class="mt-12 grid auto-rows-[220px] grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4"
    >

      <figure
        *ngFor="let image of images; let i = index"
        class="group relative overflow-hidden rounded-md bg-slate-200 shadow-sm"
        [ngClass]="{
          'sm:col-span-2': i === 0 || i === 5,
          'lg:row-span-2': i === 0
        }"
      >

        <!-- IMAGE -->
        <img
          [src]="image.imageUrl"
          [alt]="image.title || 'School gallery photo'"
          class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        />


        <!-- OVERLAY -->
        <figcaption
          class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-950/80 to-transparent p-4 text-sm font-bold text-white"
        >

          <span class="block">
            {{ image.caption }}
          </span>

          <span
            *ngIf="image.title"
            class="mt-1 block text-xs font-medium text-white/80"
          >
            {{ image.title }}
          </span>

        </figcaption>

      </figure>

    </div>


    <!-- EMPTY -->
    <div
      *ngIf="!loading && !errorMessage && images.length === 0"
      class="mt-12 rounded-xl border border-slate-200 bg-white p-10 text-center"
    >

      <p class="font-semibold text-slate-600">
        No gallery photos are currently published.
      </p>

    </div>

  </div>

</section>
